# Builds the Vite/React single-page app and publishes it to GitHub Pages.
#
# Prerequisite: Settings -> Pages -> Source must be "GitHub Actions". The
# `enablement` input below cannot set that up on its own (see the note on it).
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        # No `|| true` here: a broken install must not reach production.
        run: npm ci
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Best effort only. Auto-enabling Pages requires a PAT or App token, so
          # with the default GITHUB_TOKEN this is a no-op while Pages is already
          # enabled, and it documents the intent if the repo is ever recreated.
          enablement: true
      - name: Build with Vite
        # A project site is served from a subpath, so the asset base must match
        # it -- `base_path` resolves to "/CalculixHub". Only the static client
        # bundle is built: `npm run build` would also emit the esbuild server
        # bundle, which Pages cannot execute and should not publish.
        run: npx vite build --base="${{ steps.pages.outputs.base_path }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
