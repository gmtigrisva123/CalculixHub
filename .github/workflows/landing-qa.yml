name: Landing QA

# The landing page's QA harness: qa/landing/ (qa/landing/README.md), built to
# docs/landing-3d/SPEC.md §16 as milestone M0.
#
# M0: both jobs report and do not block (continue-on-error). Each gate becomes
# blocking with the milestone that owns it (SPEC §17), all of them by M10; then
# LX_ENFORCE=1 turns the reported numbers into assertions and continue-on-error
# goes.

on:
  pull_request:
    paths:
      - 'src/components/landing/**'
      - 'src/styles/landing-*.css'
      - 'src/boot/**'
      - 'src/main.tsx'
      - 'index.html'
      - 'vite.config.ts'
      - 'scripts/landing-*.mjs'
      - 'qa/landing/**'
      - 'qa/package.json'
      - 'qa/package-lock.json'
      - '.github/workflows/landing-qa.yml'
  push:
    branches:
      - 'claude/**'
      - 'main'
    paths:
      - 'src/components/landing/**'
      - 'src/styles/landing-*.css'
      - 'src/boot/**'
      - 'src/main.tsx'
      - 'index.html'
      - 'vite.config.ts'
      - 'scripts/landing-*.mjs'
      - 'qa/landing/**'
      - 'qa/package.json'
      - 'qa/package-lock.json'
      - '.github/workflows/landing-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing-qa:
    name: landing-qa
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # M0: report, do not block.
    continue-on-error: true
    env:
      # The milestone the page is at: budgets that apply from a later one are shown, never enforced.
      LX_STAGE: M1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/package-lock.json

      - name: Install the app
        run: npm ci

      - name: Build (the plugin writes the static first frame into dist/index.html)
        run: npx vite build

      - name: Install the harness
        working-directory: qa
        run: npm ci

      - name: Install Chromium
        working-directory: qa
        run: npx playwright install --with-deps chromium

      - name: Bundle budgets
        working-directory: qa
        run: node landing/budgets.mjs

      - name: Vitals, scroll trace, fallbacks and the takeover
        # Also after a budget step that failed: this job reports everything it can.
        if: ${{ !cancelled() }}
        working-directory: qa
        run: npx playwright test -c landing/playwright.config.mjs --grep "@perf|@fallback|@m1"

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: landing-qa-report
          path: |
            qa/landing/report
            qa/test-results
          if-no-files-found: ignore
          retention-days: 14

  # The 132 screenshots of SPEC §16.3, in two passes: the base build writes the
  # snapshots, then the head build is compared with them. Snapshots are never
  # committed. One harness (the head's) runs both passes, so a base without a
  # harness of its own is compared too.
  landing-visual:
    name: landing-visual
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # M0: report, do not block.
    continue-on-error: true
    env:
      LX_SNAPSHOT_DIR: ${{ github.workspace }}/landing-snapshots
    steps:
      - name: Check out the base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      # The default ref of a pull_request run: the head merged into the base, which is what would land.
      - name: Check out the head
        uses: actions/checkout@v4
        with:
          path: head

      - uses: actions/setup-node@v4
        with:
          node-version-file: 'head/.nvmrc'
          cache: npm
          cache-dependency-path: |
            base/package-lock.json
            head/package-lock.json
            head/qa/package-lock.json

      - name: Build the base
        working-directory: base
        run: |
          npm ci
          npx vite build

      - name: Build the head
        working-directory: head
        run: |
          npm ci
          npx vite build

      - name: Install the harness and Chromium
        working-directory: head/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Pass 1, the base build writes the snapshots
        working-directory: head/qa
        env:
          LX_ROOT: ${{ github.workspace }}/base
          LX_PORT: 4173
          LX_REPORT_DIR: ${{ github.workspace }}/head/qa/landing/report/base
        run: npx playwright test -c landing/playwright.config.mjs --grep @visual --update-snapshots --output=landing/report/base/test-results

      - name: Pass 2, the head build is compared with them
        if: ${{ !cancelled() }}
        working-directory: head/qa
        env:
          LX_PORT: 4174
        run: npx playwright test -c landing/playwright.config.mjs --grep @visual

      - name: Upload the report and the diffs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: landing-visual-report
          path: |
            head/qa/landing/report
            head/qa/test-results
          if-no-files-found: ignore
          retention-days: 14
