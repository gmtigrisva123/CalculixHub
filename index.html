<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is required for env(safe-area-inset-*) to report real
      values on notched iPhones. Without it the insets resolve to 0 and the
      bottom tab rail sits under the home indicator.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CalculixHub — A place to think</title>
    <meta name="description" content="Stay with the question. Contest math from AMC to IMO, with problems picked to fit your level and talked through one step at a time." />
    <meta name="keywords" content="calculixhub, math competition practice, amc, aime, usamo, imo, math olympiad training, adaptive math practice, past papers, ai math tutor" />
    <meta name="author" content="Calculix Academic Board" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CalculixHub — A place to think" />
    <meta property="og:description" content="Stay with the question. Contest math from AMC to IMO, with problems picked to fit your level and talked through one step at a time." />
    <meta property="og:site_name" content="CalculixHub" />
    <meta property="og:url" content="https://calculixhub.com/" />
    <!--
      The card shown when the link is shared. Chat apps and social networks need
      an absolute URL here, and they cache it by URL: when the picture changes,
      bump the ?v= number (or re-scrape the link in the platform's debugger).
      Regenerated with scripts/generate-icons.py.
    -->
    <meta property="og:image" content="https://calculixhub.com/og-image.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="calculixhub, with its lowercase e logo: Stay with the question. A glowing Möbius strip floats beside the headline." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CalculixHub — A place to think" />
    <meta name="twitter:description" content="Stay with the question. Contest math from AMC to IMO, with problems picked to fit your level and talked through one step at a time." />
    <meta name="twitter:image" content="https://calculixhub.com/og-image.png?v=2" />
    <meta name="twitter:image:alt" content="calculixhub, with its lowercase e logo: Stay with the question. A glowing Möbius strip floats beside the headline." />

    <!-- One logo, the "e", in every size: see src/components/brand.ts. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <!-- PNG fallbacks: Google Search and some browsers ignore SVG favicons. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <!--
      Webfonts.

      Served from this origin (see src/styles/fonts.css), not from Google. A
      first visit used to open two more connections, to fonts.googleapis.com
      and fonts.gstatic.com, and could not draw a word until a stylesheet had
      come back from the first of them. Now the only thing between the HTML and
      text on screen is this site's own CSS.

      The two files below are the faces the landing hero is set in: Geist for
      "Stay with the", Newsreader's italic for "question". Preloading starts
      them downloading alongside the stylesheet, so the headline is normally
      drawn in its real type on the first frame instead of arriving in a
      fallback and jumping. Everything else (Geist Mono, the upright
      Newsreader, Caveat) is fetched when a page first uses it.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-italic.woff2" />

    <!--
      The colour the browser tints its own chrome with. Declared before the
      boot script, which corrects it for the night theme: a script cannot
      change a tag that has not been parsed yet.
    -->
    <meta name="theme-color" content="#f7f5ef" />

    <!--
      Boot: the theme, and the first frame.

      This runs before the first paint, and it has to. Two things are decided
      here that cannot wait for the app's own code:

      1. The theme. Otherwise the browser paints daylight and React corrects it
         a beat later, a full-screen flash on every cold load for anyone using
         the night theme. `data-theme` always holds the *resolved* theme, never
         `system`, which is what lets styles/tokens.css describe night once.
         Kept in sync with src/lib/theme.ts, which owns every switch after
         this one.

      2. Which ground to paint while the app loads (`data-boot`). The landing
         page opens on a night stage and the workspace on paper, so a single
         neutral colour would be wrong for one of them and would have to be
         swapped under the visitor's eyes. A stored session or a guest pass
         means the workspace; a sign-in or recovery link means the paper of the
         forms; anything else is a first visit, and gets the night. The app
         reads the same answer from src/boot/boot.ts.

      Deliberately inline and synchronous: a module script is deferred by
      definition and would run after paint.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var resolved = 'light';
        try {
          var stored = localStorage.getItem('calculix_theme');
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          resolved = pref === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
        } catch (e) {
          // Private browsing can throw on localStorage access. Daylight is a
          // safe floor, and the app corrects itself once React mounts.
        }
        root.dataset.theme = resolved;

        var boot = 'landing';
        try {
          var query = new URLSearchParams(location.search);
          var link = query.has('code') || query.has('error') || query.has('auth') || query.has('recovery') || /error=|access_token=|type=/.test(location.hash);
          var session = !!localStorage.getItem('calculixhub.auth');
          var guest = !query.has('home') && !link && (query.get('demo') === '1' || localStorage.getItem('calculix_guest_access') === 'true');
          boot = query.get('preview') === 'ios' ? 'paper' : session && !query.has('recovery') ? 'workspace' : guest ? 'workspace' : link ? 'paper' : 'landing';
        } catch (e) {}
        root.dataset.boot = boot;

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', boot === 'landing' ? '#f8f4ed' : resolved === 'dark' ? '#151f24' : '#f1eee6');
      })();
    </script>

    <!--
      The first frame's styles. Inline, so they apply with the HTML and do not
      wait for the app's stylesheet.

      `#boot` is one fixed element over the page. It is drawn entirely with
      backgrounds: no images, no fonts, nothing to fetch. Its colours repeat
      what the real screens use (the landing's night stage in
      styles/landing-experience.css, the workspace's desk and sheet in
      styles/shell.css), so when src/boot/boot.ts fades it out, what is
      underneath is already the same picture.

      The mark in the middle holds back for a third of a second. On a fast
      connection the app is ready before then and the visitor sees only the
      ground resolve into the page; the mark is for the slow cases, where it
      says "this is loading" rather than "this is broken".
    -->
    <style>
      html { background: #f8f4ed; }
      html[data-boot='workspace'] { background: #f1eee6; }
      html[data-boot='paper'] { background: #f7f5ef; }
      html[data-theme='dark'][data-boot='workspace'] { background: #151f24; }
      html[data-theme='dark'][data-boot='paper'] { background: #1b272d; }
      body { margin: 0; }

      #boot, .boot-hold { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; }
      #boot { opacity: 1; transition: opacity .42s cubic-bezier(.4, 0, .2, 1); contain: strict; }
      #boot.is-leaving { opacity: 0; pointer-events: none; }
      .boot-hold { position: static; min-height: 100dvh; }

      /* Landing: paper frame, night stage. */
      #boot { background: #f8f4ed; }
      .boot-stage { position: absolute; inset: clamp(8px, 1.05vw, 16px); border-radius: clamp(10px, 1.1vw, 16px);
        background:
          radial-gradient(26% 34% at 72% 46%, rgba(0, 78, 88, .55), transparent 70%),
          radial-gradient(52% 62% at 70% 44%, rgba(0, 58, 72, .85), transparent 72%),
          linear-gradient(170deg, #001822 0%, #000c15 100%); }

      /* Workspace: the desk, the rail, the sheet. Widths match styles/shell.css. */
      html[data-boot='workspace'] #boot { background: #f1eee6; }
      html[data-boot='workspace'] .boot-stage { inset: 0 0 0 264px; border-radius: 22px 0 0 0; background: #f9f7f1; box-shadow: 0 0 0 1px #e3e0d6; }
      html[data-boot='paper'] #boot { background: #f7f5ef; }
      html[data-boot='paper'] .boot-stage { display: none; }
      html[data-theme='dark'][data-boot='workspace'] #boot { background: #151f24; }
      html[data-theme='dark'][data-boot='workspace'] .boot-stage { background: #1b272d; box-shadow: 0 0 0 1px #2f3f46; }
      html[data-theme='dark'][data-boot='paper'] #boot { background: #1b272d; }
      @media (max-width: 1023px) { html[data-boot='workspace'] .boot-stage { inset: 0; border-radius: 0; } }

      .boot-mark { position: relative; width: 44px; height: 44px; color: #7ddfee; opacity: 0; animation: boot-in .5s .34s ease forwards; }
      html[data-boot='workspace'] .boot-mark, html[data-boot='paper'] .boot-mark, .boot-hold .boot-mark { color: #426c7b; }
      html[data-theme='dark'][data-boot='workspace'] .boot-mark, html[data-theme='dark'][data-boot='paper'] .boot-mark, html[data-theme='dark'] .boot-hold .boot-mark { color: #afcbd3; }
      @media (min-width: 1024px) { html[data-boot='workspace'] #boot .boot-mark { left: 132px; } }
      .boot-mark svg { display: block; width: 100%; height: 100%; }
      .boot-mark path { stroke-dasharray: 100; stroke-dashoffset: 100; animation: boot-draw 1.5s .34s cubic-bezier(.65, 0, .35, 1) infinite alternate; }
      .boot-mark circle { opacity: .9; }
      .boot-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #boot { transition: none; }
        .boot-mark { animation: none; opacity: 1; }
        .boot-mark path { animation: none; stroke-dashoffset: 0; }
      }
    </style>

    <!--
      Installable web app.

      Vite rewrites these root-relative URLs with whatever --base the build used,
      so they stay correct on Vercel and Cloudflare (served from /) and on GitHub
      Pages (served from /CalculixHub/). The manifest's own URLs are relative and
      resolve against the manifest, so it needs no build-time substitution.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      iOS ignores the manifest when adding to the home screen: the name comes
      from apple-mobile-web-app-title and the icon from apple-touch-icon, which
      must be an opaque PNG because iOS composites transparency onto black.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CalculixHub" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  </head>
  <body>
    <!-- The first frame: see the inline styles above and src/boot/boot.ts. The mark is src/components/brand.ts. -->
    <div id="boot" aria-hidden="true">
      <div class="boot-stage"></div>
      <span class="boot-mark">
        <svg viewBox="0 0 40 40" fill="none"><path pathLength="100" d="M30 9C11 2 2 27 18 32c7 3 15-3 15-10M7 23 32 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" /><circle cx="31" cy="12" r="3" fill="currentColor" /></svg>
      </span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
